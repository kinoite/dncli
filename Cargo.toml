# Cargo.toml

[package]
name = "dncli"
version = "0.1.2"
edition = "2021"

[dependencies]
clap = { version = "4.5.11", features = ["derive"] }
reqwest = { version = "0.12.5", features = ["stream", "json", "native-tls"] }
tokio = { version = "1.38.0", features = ["full"] }
indicatif = "0.17"
url = "2.5.0"
futures-util = "0.3.30"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
confy = "0.5"
bytes = "1.0"
futures = "0.3.30"
rustorrent = "0.1.0"
